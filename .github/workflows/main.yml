name: Deploy Sales API

on:
  push:
    branches:
      - main
    paths:
      - 'SalesImporter/**'

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: SalesApi
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SalesImporter/SalesApi/SalesApi.csproj

      - name: Build
        run: dotnet build SalesImporter/SalesApi/SalesApi.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SalesImporter/SalesApi/SalesApi.csproj --configuration Release --output ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
``
